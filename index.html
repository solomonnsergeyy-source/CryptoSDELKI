<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сделки PHOENIX</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Кастомный скроллбар для выпадающего списка */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        /* Убираем стрелочки у числовых инпутов */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        /* Стили для ползунка */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Уведомление (Toast) -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-4 py-2 rounded-lg shadow-lg font-medium opacity-0 transition-opacity duration-300 pointer-events-none z-[100]">
        Скопировано!
    </div>

    <!-- Главный контейнер -->
    <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.4)] border border-slate-700/50 p-6 relative">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 uppercase tracking-wide">
                Сделки PHOENIX
            </h1>
            <p class="text-[11px] text-slate-500/80 font-semibold mt-1.5 tracking-widest uppercase">
                by Tayler Derden
            </p>
        </div>

        <div class="space-y-5">
            <div class="relative z-50">
                <label class="block text-sm font-medium text-slate-400 mb-1.5">Актив</label>
                
                <!-- Кнопка открытия дропдауна -->
                <button id="coinSelectBtn" type="button" class="w-full bg-slate-900 border border-slate-700 hover:border-blue-500/50 rounded-xl px-4 py-3 text-white focus:outline-none transition-all uppercase font-semibold text-left flex justify-between items-center shadow-inner">
                    <div class="flex items-center gap-2">
                        <span id="selectedCoinText" class="text-lg tracking-wide">TRX</span>
                        <span class="text-xs text-slate-500 font-normal">USDT</span>
                    </div>
                    <svg class="w-5 h-5 text-slate-400 transition-transform duration-200" id="coinSelectIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <!-- Выпадающее меню -->
                <div id="coinDropdown" class="hidden absolute left-0 right-0 top-[105%] bg-slate-800 border border-slate-600 rounded-xl shadow-2xl overflow-hidden flex flex-col h-72">
                    <div class="p-3 bg-slate-800 border-b border-slate-700 shrink-0 sticky top-0">
                        <div class="relative">
                            <svg class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <input type="text" id="coinSearch" class="w-full bg-slate-900 border border-slate-600 rounded-lg pl-10 pr-3 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500 placeholder-slate-500 transition-colors" placeholder="Поиск (например, PEPE)..." autocomplete="off">
                        </div>
                    </div>
                    <div id="coinListContainer" class="overflow-y-auto flex-1 p-1.5 space-y-0.5">
                        <div class="text-center text-slate-500 text-sm py-4">Загрузка активов...</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-sm font-medium text-slate-400">Текущая цена (USDT)</label>
                    <span id="priceStatus" class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                </div>
                <input type="number" id="currentPrice" step="any"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors font-mono text-lg shadow-inner">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1.5">Leverage (x)</label>
                    <input type="number" id="leverage" value="25" min="1" max="150"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors font-semibold text-center">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1.5">Deposit (%)</label>
                    <div class="relative">
                        <input type="number" id="depositNum" value="10" min="1" max="100"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors font-semibold text-center pr-8">
                        <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-500 font-bold">%</span>
                    </div>
                </div>
            </div>

            <div class="pt-2 px-1">
                <input type="range" id="depositSlider" min="1" max="100" value="10" class="w-full cursor-pointer">
                <div class="flex justify-between text-xs text-slate-500 mt-2 font-medium px-1 select-none">
                    <span class="cursor-pointer hover:text-blue-400 transition-colors py-1 -ml-1" onclick="updateDeposit(1)">1%</span>
                    <span class="cursor-pointer hover:text-blue-400 transition-colors py-1" onclick="updateDeposit(25)">25%</span>
                    <span class="cursor-pointer hover:text-blue-400 transition-colors py-1" onclick="updateDeposit(50)">50%</span>
                    <span class="cursor-pointer hover:text-blue-400 transition-colors py-1" onclick="updateDeposit(75)">75%</span>
                    <span class="cursor-pointer hover:text-blue-400 transition-colors py-1 -mr-1" onclick="updateDeposit(100)">100%</span>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2">Цель Take Profit (+%)</label>
                <div class="grid grid-cols-5 gap-2" id="tpButtons">
                    <button type="button" data-tp="30" class="tp-btn py-2 rounded-lg border border-slate-600 font-semibold text-sm transition-all text-slate-300 hover:border-emerald-500 hover:text-emerald-400 bg-slate-800">30%</button>
                    <button type="button" data-tp="35" class="tp-btn py-2 rounded-lg border border-slate-600 font-semibold text-sm transition-all text-slate-300 hover:border-emerald-500 hover:text-emerald-400 bg-slate-800">35%</button>
                    <button type="button" data-tp="45" class="tp-btn py-2 rounded-lg border border-emerald-500 font-bold text-sm transition-all text-white bg-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.2)]">45%</button>
                    <button type="button" data-tp="65" class="tp-btn py-2 rounded-lg border border-slate-600 font-semibold text-sm transition-all text-slate-300 hover:border-emerald-500 hover:text-emerald-400 bg-slate-800">65%</button>
                    <button type="button" data-tp="70" class="tp-btn py-2 rounded-lg border border-slate-600 font-semibold text-sm transition-all text-slate-300 hover:border-emerald-500 hover:text-emerald-400 bg-slate-800">70%</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2">Направление</label>
                <div class="grid grid-cols-2 gap-3" id="directionButtons">
                    <button type="button" data-dir="LONG" class="dir-btn py-3 rounded-xl border border-emerald-500 font-bold text-lg transition-all text-white bg-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                        📈 LONG
                    </button>
                    <button type="button" data-dir="SHORT" class="dir-btn py-3 rounded-xl border border-slate-700 font-bold text-lg transition-all text-slate-400 bg-slate-900 hover:border-rose-500 hover:text-rose-400">
                        📉 SHORT
                    </button>
                </div>
            </div>

            <div class="mt-6">
                <label class="block text-sm font-medium text-slate-400 mb-1.5 flex justify-between items-end">
                    <div class="flex items-center gap-3">
                        <span>Готовый сигнал</span>
                        <!-- Переключатель смайликов -->
                        <label class="inline-flex items-center cursor-pointer" title="Включить/выключить смайлики">
                            <input type="checkbox" id="emojiToggle" class="sr-only peer" checked>
                            <div class="relative w-7 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-slate-300 after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-emerald-500"></div>
                            <span class="ms-1.5 text-[10px] font-semibold tracking-wider text-slate-500 uppercase peer-checked:text-emerald-400 transition-colors">Emoji</span>
                        </label>
                    </div>
                    <span class="text-xs text-slate-500 font-normal">Стоп-лосс: 15%</span>
                </label>
                <textarea id="resultText" readonly rows="7" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-emerald-400 focus:outline-none font-mono text-sm resize-none shadow-inner leading-relaxed"></textarea>
            </div>

            <button id="copyBtn" type="button" 
                class="w-full bg-gradient-to-r from-blue-600 to-emerald-500 hover:from-blue-500 hover:to-emerald-400 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transform transition-all active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                СКОПИРОВАТЬ СДЕЛКУ
            </button>
        </div>
    </main>

    <script>
        // Состояние приложения
        let state = {
            symbol: 'TRX',
            price: 0.33,
            leverage: 25,
            deposit: 10,
            direction: 'LONG',
            tpPercent: 45,
            slPercent: 15,
            useEmojis: true
        };
        let priceInterval = null;
        let allCoinsData = [];

        // Элементы DOM
        const elCoinSelectBtn = document.getElementById('coinSelectBtn');
        const elSelectedCoinText = document.getElementById('selectedCoinText');
        const elCoinSelectIcon = document.getElementById('coinSelectIcon');
        const elCoinDropdown = document.getElementById('coinDropdown');
        const elCoinSearch = document.getElementById('coinSearch');
        const elCoinListContainer = document.getElementById('coinListContainer');
        
        const elPrice = document.getElementById('currentPrice');
        const elLeverage = document.getElementById('leverage');
        const elDepositNum = document.getElementById('depositNum');
        const elDepositSlider = document.getElementById('depositSlider');
        
        const elTpBtns = document.querySelectorAll('.tp-btn');
        const elDirBtns = document.querySelectorAll('.dir-btn');
        
        const elResultText = document.getElementById('resultText');
        const elCopyBtn = document.getElementById('copyBtn');
        const elToast = document.getElementById('toast');
        const elEmojiToggle = document.getElementById('emojiToggle');

        // Инициализация
        async function init() {
            await fetchAllCoins();
            startPriceUpdates(); // Запускаем автообновление (сразу подтянет цену TRX)
        }

        // Загрузка списка всех монет с Binance
        async function fetchAllCoins() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price');
                const data = await res.json();
                
                // Фильтруем только USDT и убираем суффикс
                allCoinsData = data
                    .filter(t => t.symbol.endsWith('USDT'))
                    .map(t => t.symbol.replace('USDT', ''))
                    .sort(); // Сортируем по алфавиту
                
                renderCoinList(allCoinsData);
            } catch (error) {
                console.error('Ошибка загрузки пар:', error);
                elCoinListContainer.innerHTML = '<div class="text-rose-400 text-sm text-center py-4">Ошибка сети. Проверьте интернет.</div>';
            }
        }

        // Отрисовка списка монет в Dropdown
        function renderCoinList(coins) {
            if (coins.length === 0) {
                elCoinListContainer.innerHTML = '<div class="text-slate-500 text-sm text-center py-4 font-medium">Монета не найдена</div>';
                return;
            }
            
            const html = coins.map(coin => 
                `<button type="button" class="w-full text-left px-4 py-2.5 text-sm font-bold text-slate-300 hover:bg-slate-700/70 hover:text-white rounded-lg transition-colors flex items-center justify-between" onclick="selectCoin('${coin}')">
                    <span>${coin}</span>
                    <span class="text-xs text-slate-500 font-normal">USDT</span>
                </button>`
            ).join('');
            
            elCoinListContainer.innerHTML = html;
        }

        // Выбор монеты из списка
        window.selectCoin = function(symbol) {
            state.symbol = symbol;
            elSelectedCoinText.innerText = symbol;
            closeDropdown();
            // Сбрасываем цену визуально до обновления
            elPrice.value = ''; 
            fetchCurrentPrice();
        };

        // Управление Dropdown
        function openDropdown() {
            elCoinDropdown.classList.remove('hidden');
            elCoinSelectBtn.classList.add('border-blue-500');
            elCoinSelectIcon.classList.add('rotate-180');
            // Очищаем поиск и фокусируемся
            elCoinSearch.value = '';
            renderCoinList(allCoinsData);
            setTimeout(() => elCoinSearch.focus(), 50);
        }

        function closeDropdown() {
            elCoinDropdown.classList.add('hidden');
            elCoinSelectBtn.classList.remove('border-blue-500');
            elCoinSelectIcon.classList.remove('rotate-180');
        }

        elCoinSelectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (elCoinDropdown.classList.contains('hidden')) {
                openDropdown();
            } else {
                closeDropdown();
            }
        });

        // Поиск в Dropdown
        elCoinSearch.addEventListener('input', (e) => {
            const term = e.target.value.toUpperCase();
            const filtered = allCoinsData.filter(c => c.includes(term));
            renderCoinList(filtered);
        });

        // Закрытие при клике вне
        document.addEventListener('click', (e) => {
            if (!elCoinDropdown.contains(e.target) && !elCoinSelectBtn.contains(e.target)) {
                closeDropdown();
            }
        });

        // Получение актуальной цены
        async function fetchCurrentPrice() {
            if (!state.symbol) return;
            const symbol = state.symbol + 'USDT';
            
            try {
                const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();
                
                const currentMarketPrice = parseFloat(data.price);
                
                // Если пользователь не редактирует инпут ручками в данный момент
                if (document.activeElement !== elPrice) {
                    elPrice.value = currentMarketPrice;
                }
                
                state.price = currentMarketPrice;
                generateSignal();
            } catch (error) {
                console.error("Ошибка обновления цены:", error);
            }
        }

        // Автообновление
        function startPriceUpdates() {
            fetchCurrentPrice(); // первый вызов
            if (priceInterval) clearInterval(priceInterval);
            // Обновляем раз в 20 секунд
            priceInterval = setInterval(fetchCurrentPrice, 20000);
        }

        // Форматирование цены (убираем лишние нули)
        function formatPrice(num) {
            if (!num || isNaN(num)) return '0';
            // Используем parseFloat с toFixed(8) чтобы отсечь лишние десятичные и удалить незначащие нули в конце
            return parseFloat(num.toFixed(8)).toString();
        }

        // Генерация текста сигнала и расчет математики
        function generateSignal() {
            // Математика (без учета плеча, как просили в примере: 0.33 + 40% = 0.462)
            const tpDecimal = state.tpPercent / 100;
            const slDecimal = state.slPercent / 100;
            
            let tpPrice = 0;
            let slPrice = 0;

            if (state.direction === 'LONG') {
                tpPrice = state.price * (1 + tpDecimal);
                slPrice = state.price * (1 - slDecimal);
            } else { // SHORT
                tpPrice = state.price * (1 - tpDecimal);
                slPrice = state.price * (1 + slDecimal);
            }

            // Формируем красивый шаблон
            const e = state.useEmojis;
            const dirEmoji = e ? (state.direction === 'LONG' ? '📈 ' : '📉 ') : '';
            const levEmoji = e ? '🚀 ' : '';
            const depEmoji = e ? '💰 ' : '';
            const entEmoji = e ? '🎯 ' : '';
            const tpEmoji = e ? '✅ ' : '';
            const slEmoji = e ? '🛑 ' : '';
            
            const template = `${state.symbol}/USDT
${levEmoji}Leverage: ${state.leverage}x
${depEmoji}Deposit: ${state.deposit}%
${entEmoji}Entry: Market
${tpEmoji}TP: ${formatPrice(tpPrice)}
${slEmoji}SL: ${formatPrice(slPrice)}
${dirEmoji}${state.direction}`;

            elResultText.value = template;
        }

        // --- Обработчики событий ---

        // Ручной ввод цены
        elPrice.addEventListener('input', (e) => {
            state.price = parseFloat(e.target.value) || 0;
            generateSignal();
        });

        // Плечо
        elLeverage.addEventListener('input', (e) => {
            state.leverage = parseInt(e.target.value) || 25;
            generateSignal();
        });

        // Синхронизация депозита (Инпут <-> Ползунок)
        function updateDeposit(val) {
            let num = parseInt(val) || 1;
            if (num < 1) num = 1;
            if (num > 100) num = 100;
            state.deposit = num;
            elDepositNum.value = num;
            elDepositSlider.value = num;
            generateSignal();
        }
        
        elDepositNum.addEventListener('input', (e) => updateDeposit(e.target.value));
        elDepositSlider.addEventListener('input', (e) => updateDeposit(e.target.value));

        // Кнопки TP
        elTpBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Сброс стилей у всех кнопок
                elTpBtns.forEach(b => {
                    b.className = 'tp-btn py-2 rounded-lg border border-slate-600 font-semibold text-sm transition-all text-slate-300 hover:border-emerald-500 hover:text-emerald-400 bg-slate-800';
                });
                // Активный стиль для нажатой
                const target = e.target;
                target.className = 'tp-btn py-2 rounded-lg border border-emerald-500 font-bold text-sm transition-all text-white bg-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.2)]';
                
                state.tpPercent = parseFloat(target.dataset.tp);
                generateSignal();
            });
        });

        // Переключатель смайликов
        elEmojiToggle.addEventListener('change', (e) => {
            state.useEmojis = e.target.checked;
            generateSignal();
        });

        // Копирование в буфер обмена
        elCopyBtn.addEventListener('click', () => {
            const textToCopy = elResultText.value;
            if (!textToCopy) return;

            // Современный метод через clipboard
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(showToast);
            } else {
                // Фолбэк для старых браузеров или iframe
                elResultText.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Ошибка копирования', err);
                }
                window.getSelection().removeAllRanges();
            }
        });

        // Функция показа уведомления
        function showToast() {
            elToast.classList.remove('opacity-0');
            elToast.classList.add('opacity-100');
            setTimeout(() => {
                elToast.classList.remove('opacity-100');
                elToast.classList.add('opacity-0');
            }, 2000);
        }

        // Запуск
        init();

    </script>
</body>
</html>
